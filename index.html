const ROUNDS = 6;
const AMBER = '#F5A623';
const AMBER_BRIGHT = '#FFB933';

function ScoreKeeper() {
  const [view, setView] = React.useState('input');
  const [leaderboardMode, setLeaderboardMode] = React.useState('totals');
  const [activeRound, setActiveRound] = React.useState(0);
  const [players, setPlayers] = React.useState(() =>
    Array.from({ length: 10 }, (_, i) => ({
      id: i + 1,
      name: `Player ${i + 1}`,
      rounds: Array(ROUNDS).fill(0),
      eliminated: false,
    }))
  );
  const [editingId, setEditingId] = React.useState(null);
  const [tempName, setTempName] = React.useState('');
  const [editingCell, setEditingCell] = React.useState(null); // {playerId, round}
  const [tempScore, setTempScore] = React.useState('');

  const total = (player) => player.rounds.reduce((a, b) => a + b, 0);

  const updateRoundScore = (id, round, delta) => {
    setPlayers(prev => prev.map(p => {
      if (p.id !== id) return p;
      const newRounds = [...p.rounds];
      newRounds[round] = newRounds[round] + delta;
      return { ...p, rounds: newRounds };
    }));
  };

  const setExactRoundScore = (id, round, value) => {
    const num = parseInt(value, 10);
    if (!isNaN(num)) {
      setPlayers(prev => prev.map(p => {
        if (p.id !== id) return p;
        const newRounds = [...p.rounds];
        newRounds[round] = num;
        return { ...p, rounds: newRounds };
      }));
    }
    setEditingCell(null);
    setTempScore('');
  };

  const saveName = (id) => {
    if (tempName.trim()) {
      setPlayers(prev => prev.map(p => (p.id === id ? { ...p, name: tempName.trim() } : p)));
    }
    setEditingId(null);
    setTempName('');
  };

  const [confirmDialog, setConfirmDialog] = React.useState(null); // { message, onConfirm }

  const resetAll = () => {
    setConfirmDialog({
      message: 'Reset all scores to zero across all rounds?',
      onConfirm: () => {
        setPlayers(prev => prev.map(p => ({ ...p, rounds: Array(ROUNDS).fill(0), eliminated: false })));
      },
    });
  };

  const toggleEliminated = (id) => {
    setPlayers(prev => prev.map(p => (p.id === id ? { ...p, eliminated: !p.eliminated } : p)));
  };

  const resetRound = (round) => {
    const label = round === ROUNDS - 1 ? 'Bonus' : `Round ${round + 1}`;
    setConfirmDialog({
      message: `Reset ${label} for all players?`,
      onConfirm: () => {
        setPlayers(prev => prev.map(p => {
          const newRounds = [...p.rounds];
          newRounds[round] = 0;
          return { ...p, rounds: newRounds };
        }));
      },
    });
  };

  const sortedPlayers = [...players].sort((a, b) => {
    if (a.eliminated !== b.eliminated) return a.eliminated ? 1 : -1;
    return total(b) - total(a);
  });
  const maxScore = Math.max(...players.map(p => total(p)), 1);

  const getRankIcon = (rank) => {
    if (rank === 0) return <Crown className="w-6 h-6" style={{ color: AMBER_BRIGHT }} />;
    if (rank === 1) return <Medal className="w-6 h-6" style={{ color: '#C0C0C0' }} />;
    if (rank === 2) return <Medal className="w-6 h-6" style={{ color: '#CD7F32' }} />;
    return null;
  };

  return (
    <div style={{
      minHeight: '100vh',
      background: '#0A1628',
      fontFamily: '"JetBrains Mono", "Courier New", monospace',
      color: '#f0f0f0',
      padding: '24px',
      position: 'relative',
      overflow: 'hidden',
    }}>
      {/* Amber glows */}
      <div style={{ position: 'absolute', top: '-150px', right: '-150px', width: '500px', height: '500px',
        background: 'radial-gradient(circle, rgba(245, 166, 35, 0.12) 0%, transparent 70%)', pointerEvents: 'none' }} />
      <div style={{ position: 'absolute', bottom: '-150px', left: '-150px', width: '500px', height: '500px',
        background: 'radial-gradient(circle, rgba(245, 166, 35, 0.08) 0%, transparent 70%)', pointerEvents: 'none' }} />

      {/* Grain */}
      <div style={{
        position: 'absolute', inset: 0, opacity: 0.04,
        backgroundImage: 'url("data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'n\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.9\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23n)\'/%3E%3C/svg%3E")',
        pointerEvents: 'none',
      }} />

      <div style={{ maxWidth: '1100px', margin: '0 auto', position: 'relative', zIndex: 1 }}>
        {/* Header */}
        <header style={{
          borderBottom: `2px solid ${AMBER}`,
          paddingBottom: '20px',
          marginBottom: '28px',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          flexWrap: 'wrap',
          gap: '20px',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '20px', flexWrap: 'wrap' }}>
            <img src={LOGO_DATA_URL} alt="Wayward Improvised Theatre"
              style={{
                height: '70px',
                width: 'auto',
                display: 'block',
              }} />
            <div style={{ borderLeft: `1px solid ${AMBER}40`, paddingLeft: '20px',
              display: 'flex', flexDirection: 'column', gap: '4px' }}>
              <div style={{ fontSize: '10px', letterSpacing: '0.3em', color: AMBER, fontWeight: 700 }}>
                LIVE SESSION · {ROUNDS} ROUNDS
              </div>
              <div style={{ fontSize: '22px', fontWeight: 900, letterSpacing: '0.05em', color: '#fff',
                fontFamily: '"Bebas Neue", "Impact", sans-serif', lineHeight: 1 }}>
                SCOREBOARD
              </div>
            </div>
          </div>
          <button onClick={resetAll}
            style={{
              background: 'transparent', border: `1px solid ${AMBER}60`, color: AMBER,
              padding: '10px 18px', fontSize: '11px', letterSpacing: '0.15em', fontWeight: 700,
              cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '8px',
              transition: 'all 0.2s', fontFamily: 'inherit',
            }}
            onMouseEnter={e => { e.currentTarget.style.background = AMBER; e.currentTarget.style.color = '#0A1628'; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = AMBER; }}>
            <RotateCcw className="w-4 h-4" />
            RESET ALL
          </button>
        </header>

        {/* Main tabs */}
        <div style={{ display: 'flex', gap: '0', marginBottom: '24px', borderBottom: `1px solid ${AMBER}20` }}>
          {[
            { key: 'input', label: 'INPUT', icon: Users },
            { key: 'leaderboard', label: 'LEADERBOARD', icon: Trophy },
          ].map(tab => {
            const Icon = tab.icon;
            const active = view === tab.key;
            return (
              <button key={tab.key} onClick={() => setView(tab.key)}
                style={{
                  background: 'transparent', border: 'none',
                  borderBottom: active ? `3px solid ${AMBER}` : '3px solid transparent',
                  color: active ? AMBER : 'rgba(255, 255, 255, 0.5)',
                  padding: '14px 24px', fontSize: '13px', letterSpacing: '0.2em', fontWeight: 700,
                  cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '10px',
                  transition: 'all 0.2s', fontFamily: 'inherit', marginBottom: '-1px',
                }}>
                <Icon className="w-4 h-4" />
                {tab.label}
              </button>
            );
          })}
        </div>

        {/* INPUT VIEW */}
        {view === 'input' && (
          <>
            {/* Round selector */}
            <div style={{
              display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '20px',
              flexWrap: 'wrap',
            }}>
              <span style={{ fontSize: '10px', letterSpacing: '0.2em', color: `${AMBER}99`,
                fontWeight: 700, marginRight: '4px' }}>
                ROUND ━━
              </span>
              {Array.from({ length: ROUNDS }, (_, i) => {
                const active = activeRound === i;
                const isBonus = i === ROUNDS - 1;
                return (
                  <button key={i} onClick={() => setActiveRound(i)}
                    style={{
                      width: isBonus ? 'auto' : '44px',
                      minWidth: isBonus ? '80px' : '44px',
                      height: '44px',
                      padding: isBonus ? '0 14px' : 0,
                      background: active ? AMBER : 'transparent',
                      border: `1px solid ${active ? AMBER : AMBER + '40'}`,
                      color: active ? '#0A1628' : AMBER,
                      fontSize: isBonus ? '15px' : '18px',
                      fontWeight: 800,
                      letterSpacing: isBonus ? '0.1em' : 'normal',
                      fontFamily: '"Bebas Neue", Impact, sans-serif',
                      cursor: 'pointer', transition: 'all 0.15s',
                    }}
                    onMouseEnter={e => { if (!active) e.currentTarget.style.background = `${AMBER}20`; }}
                    onMouseLeave={e => { if (!active) e.currentTarget.style.background = 'transparent'; }}>
                    {isBonus ? 'BONUS' : i + 1}
                  </button>
                );
              })}
              <button onClick={() => resetRound(activeRound)}
                style={{
                  marginLeft: 'auto', background: 'transparent',
                  border: `1px solid rgba(255, 255, 255, 0.15)`,
                  color: 'rgba(255, 255, 255, 0.5)',
                  padding: '8px 14px', fontSize: '10px', letterSpacing: '0.15em', fontWeight: 700,
                  cursor: 'pointer', fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: '6px',
                  transition: 'all 0.2s',
                }}
                onMouseEnter={e => { e.currentTarget.style.color = '#fff'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.4)'; }}
                onMouseLeave={e => { e.currentTarget.style.color = 'rgba(255,255,255,0.5)'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.15)'; }}>
                <RotateCcw className="w-3 h-3" />
                CLEAR {activeRound === ROUNDS - 1 ? 'BONUS' : `ROUND ${activeRound + 1}`}
              </button>
            </div>

            <div style={{ display: 'grid', gap: '10px' }}>
              {players.map((player, idx) => {
                const roundScore = player.rounds[activeRound];
                const playerTotal = total(player);
                return (
                  <div key={player.id}
                    style={{
                      background: player.eliminated ? 'rgba(255, 255, 255, 0.02)' : 'rgba(245, 166, 35, 0.03)',
                      border: `1px solid ${player.eliminated ? 'rgba(255, 255, 255, 0.08)' : AMBER + '20'}`,
                      padding: '16px 20px',
                      display: 'grid',
                      gridTemplateColumns: 'auto 1fr auto auto auto auto',
                      alignItems: 'center', gap: '16px',
                      transition: 'all 0.2s',
                      opacity: player.eliminated ? 0.5 : 1,
                    }}
                    onMouseEnter={e => {
                      if (!player.eliminated) {
                        e.currentTarget.style.borderColor = `${AMBER}60`;
                        e.currentTarget.style.background = 'rgba(245, 166, 35, 0.06)';
                      }
                    }}
                    onMouseLeave={e => {
                      if (!player.eliminated) {
                        e.currentTarget.style.borderColor = `${AMBER}20`;
                        e.currentTarget.style.background = 'rgba(245, 166, 35, 0.03)';
                      }
                    }}>
                    <div style={{
                      width: '36px', height: '36px', display: 'flex', alignItems: 'center', justifyContent: 'center',
                      background: 'rgba(245, 166, 35, 0.1)', border: `1px solid ${AMBER}50`,
                      color: AMBER, fontWeight: 800, fontSize: '14px',
                      fontFamily: '"Bebas Neue", Impact, sans-serif', letterSpacing: '0.05em',
                    }}>
                      {String(idx + 1).padStart(2, '0')}
                    </div>

                    <div style={{ minWidth: 0 }}>
                      {editingId === player.id ? (
                        <input autoFocus value={tempName}
                          onChange={e => setTempName(e.target.value)}
                          onBlur={() => saveName(player.id)}
                          onKeyDown={e => {
                            if (e.key === 'Enter') saveName(player.id);
                            if (e.key === 'Escape') { setEditingId(null); setTempName(''); }
                          }}
                          style={{
                            background: 'rgba(0, 0, 0, 0.6)', border: `1px solid ${AMBER}`,
                            color: '#fff', padding: '6px 10px', fontSize: '15px', fontWeight: 600,
                            width: '100%', fontFamily: 'inherit', outline: 'none',
                          }} />
                      ) : (
                        <button onClick={() => { setEditingId(player.id); setTempName(player.name); }}
                          style={{
                            background: 'transparent', border: 'none', color: '#fff',
                            fontSize: '15px', fontWeight: 600, cursor: 'pointer',
                            display: 'flex', alignItems: 'center', gap: '8px', padding: 0,
                            fontFamily: 'inherit', textAlign: 'left', width: '100%',
                          }}>
                          <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                            {player.name}
                          </span>
                          <Edit3 className="w-3 h-3" style={{ opacity: 0.4, flexShrink: 0, color: AMBER }} />
                        </button>
                      )}
                      <div style={{
                        fontSize: '10px', letterSpacing: '0.15em', color: `${AMBER}80`,
                        marginTop: '4px', fontWeight: 600,
                      }}>
                        TOTAL · {playerTotal}
                      </div>
                    </div>

                    {/* Round score - editable */}
                    {editingCell && editingCell.playerId === player.id && editingCell.round === activeRound ? (
                      <input autoFocus type="number" value={tempScore}
                        onChange={e => setTempScore(e.target.value)}
                        onBlur={() => setExactRoundScore(player.id, activeRound, tempScore)}
                        onKeyDown={e => {
                          if (e.key === 'Enter') setExactRoundScore(player.id, activeRound, tempScore);
                          if (e.key === 'Escape') { setEditingCell(null); setTempScore(''); }
                        }}
                        style={{
                          background: 'rgba(0, 0, 0, 0.6)', border: `1px solid ${AMBER}`,
                          color: '#fff', padding: '6px 10px', fontSize: '24px', fontWeight: 800,
                          width: '90px', textAlign: 'right',
                          fontFamily: '"Bebas Neue", Impact, sans-serif', outline: 'none',
                        }} />
                    ) : (
                      <button
                        onClick={() => { setEditingCell({ playerId: player.id, round: activeRound }); setTempScore(String(roundScore)); }}
                        style={{
                          background: 'transparent', border: 'none',
                          color: roundScore !== 0 ? '#fff' : 'rgba(255, 255, 255, 0.3)',
                          fontSize: '32px', fontWeight: 800,
                          fontFamily: '"Bebas Neue", Impact, sans-serif',
                          cursor: 'pointer', minWidth: '70px', textAlign: 'right',
                          letterSpacing: '0.02em', padding: 0,
                        }}
                        title="Click to type exact value">
                        {roundScore}
                      </button>
                    )}

                    {/* +/- buttons */}
                    <div style={{ display: 'flex', gap: '6px' }}>
                      <button onClick={() => updateRoundScore(player.id, activeRound, -1)}
                        style={{
                          width: '40px', height: '40px',
                          background: 'rgba(255, 255, 255, 0.04)',
                          border: '1px solid rgba(255, 255, 255, 0.2)',
                          color: '#f0f0f0', cursor: 'pointer',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          transition: 'all 0.15s',
                        }}
                        onMouseEnter={e => { e.currentTarget.style.background = 'rgba(255, 255, 255, 0.1)'; e.currentTarget.style.borderColor = '#fff'; }}
                        onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255, 255, 255, 0.04)'; e.currentTarget.style.borderColor = 'rgba(255, 255, 255, 0.2)'; }}>
                        <Minus className="w-4 h-4" />
                      </button>
                      <button onClick={() => updateRoundScore(player.id, activeRound, 1)}
                        style={{
                          width: '40px', height: '40px',
                          background: AMBER, border: `1px solid ${AMBER}`, color: '#0A1628',
                          cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
                          transition: 'all 0.15s', fontWeight: 800,
                        }}
                        onMouseEnter={e => { e.currentTarget.style.background = AMBER_BRIGHT; e.currentTarget.style.borderColor = AMBER_BRIGHT; }}
                        onMouseLeave={e => { e.currentTarget.style.background = AMBER; e.currentTarget.style.borderColor = AMBER; }}>
                        <Plus className="w-4 h-4" strokeWidth={3} />
                      </button>
                    </div>

                    {/* Mini sparkline of all 6 rounds */}
                    <div style={{
                      display: 'flex', gap: '3px', alignItems: 'flex-end',
                      height: '34px', paddingLeft: '8px',
                      borderLeft: `1px solid ${AMBER}20`,
                    }}>
                      {player.rounds.map((s, r) => {
                        const isActive = r === activeRound;
                        const allMax = Math.max(...player.rounds.map(Math.abs), 1);
                        const h = s !== 0 ? Math.max(4, (Math.abs(s) / allMax) * 30) : 2;
                        return (
                          <div key={r}
                            onClick={() => setActiveRound(r)}
                            style={{
                              width: '8px',
                              height: `${h}px`,
                              background: isActive ? AMBER : (s !== 0 ? `${AMBER}80` : `${AMBER}25`),
                              cursor: 'pointer',
                              transition: 'all 0.2s',
                            }}
                            title={`${r === ROUNDS - 1 ? 'Bonus' : `Round ${r + 1}`}: ${s}`} />
                        );
                      })}
                    </div>

                    {/* Eliminated toggle */}
                    <button onClick={() => toggleEliminated(player.id)}
                      title={player.eliminated ? 'Reinstate player' : 'Mark as eliminated'}
                      style={{
                        width: '40px', height: '40px',
                        background: player.eliminated ? 'rgba(220, 50, 50, 0.15)' : 'transparent',
                        border: `1px solid ${player.eliminated ? '#dc3232' : 'rgba(255, 255, 255, 0.15)'}`,
                        color: player.eliminated ? '#ff6b6b' : 'rgba(255, 255, 255, 0.4)',
                        cursor: 'pointer',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        transition: 'all 0.15s',
                      }}
                      onMouseEnter={e => {
                        if (!player.eliminated) {
                          e.currentTarget.style.borderColor = '#dc3232';
                          e.currentTarget.style.color = '#ff6b6b';
                        }
                      }}
                      onMouseLeave={e => {
                        if (!player.eliminated) {
                          e.currentTarget.style.borderColor = 'rgba(255, 255, 255, 0.15)';
                          e.currentTarget.style.color = 'rgba(255, 255, 255, 0.4)';
                        }
                      }}>
                      <Skull className="w-4 h-4" />
                    </button>
                  </div>
                );
              })}
            </div>

            <div style={{
              marginTop: '16px', padding: '12px', fontSize: '11px',
              color: `${AMBER}80`, letterSpacing: '0.1em',
              textAlign: 'center', fontWeight: 600,
            }}>
              CLICK A ROUND NUMBER ABOVE TO SWITCH · CLICK SCORE TO TYPE EXACTLY · SKULL ELIMINATES PLAYER
            </div>
          </>
        )}

        {/* LEADERBOARD VIEW */}
        {view === 'leaderboard' && (
          <>
            {/* Mode toggle */}
            <div style={{
              display: 'flex', gap: '0', marginBottom: '20px',
              border: `1px solid ${AMBER}40`, width: 'fit-content',
            }}>
              {[
                { key: 'totals', label: 'TOTALS', icon: List },
                { key: 'breakdown', label: 'BY ROUND', icon: Grid3x3 },
              ].map(mode => {
                const Icon = mode.icon;
                const active = leaderboardMode === mode.key;
                return (
                  <button key={mode.key} onClick={() => setLeaderboardMode(mode.key)}
                    style={{
                      background: active ? AMBER : 'transparent',
                      border: 'none', color: active ? '#0A1628' : AMBER,
                      padding: '10px 18px', fontSize: '11px', letterSpacing: '0.2em', fontWeight: 700,
                      cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '8px',
                      transition: 'all 0.15s', fontFamily: 'inherit',
                    }}>
                    <Icon className="w-4 h-4" />
                    {mode.label}
                  </button>
                );
              })}
            </div>

            {/* Champion card - hidden if leader is eliminated */}
            {total(sortedPlayers[0]) > 0 && !sortedPlayers[0].eliminated && (
              <div style={{
                background: `linear-gradient(135deg, ${AMBER}25 0%, ${AMBER}08 100%)`,
                border: `2px solid ${AMBER}`,
                padding: '28px', marginBottom: '16px',
                position: 'relative', overflow: 'hidden',
              }}>
                <div style={{
                  position: 'absolute', top: '-40px', right: '-40px',
                  width: '200px', height: '200px',
                  background: `radial-gradient(circle, ${AMBER}40 0%, transparent 70%)`,
                }} />
                <div style={{
                  fontSize: '11px', letterSpacing: '0.3em', color: AMBER, fontWeight: 700,
                  marginBottom: '10px', display: 'flex', alignItems: 'center', gap: '8px', position: 'relative',
                }}>
                  <Crown className="w-4 h-4" />
                  CURRENT MAESTRO
                </div>
                <div style={{
                  fontSize: 'clamp(28px, 5vw, 48px)', fontWeight: 900,
                  fontFamily: '"Bebas Neue", Impact, sans-serif',
                  letterSpacing: '-0.01em', lineHeight: 1, color: '#fff',
                  display: 'flex', alignItems: 'baseline', justifyContent: 'space-between',
                  flexWrap: 'wrap', gap: '16px', position: 'relative',
                }}>
                  <span>{sortedPlayers[0].name}</span>
                  <span style={{ color: AMBER }}>{total(sortedPlayers[0])} PTS</span>
                </div>
              </div>
            )}

            {/* TOTALS MODE */}
            {leaderboardMode === 'totals' && (
              <div style={{ display: 'grid', gap: '12px' }}>
                {sortedPlayers.map((player, rank) => {
                  const playerTotal = total(player);
                  const isLeader = rank === 0 && playerTotal > 0 && !player.eliminated;
                  // Skip the leader since they're already shown in the Maestro card
                  if (isLeader) return null;
                  const barWidth = maxScore > 0 ? (playerTotal / maxScore) * 100 : 0;
                  const elim = player.eliminated;
                  return (
                    <div key={player.id}
                      style={{
                        background: elim ? 'rgba(255, 255, 255, 0.02)' : 'rgba(245, 166, 35, 0.04)',
                        border: `1px solid ${elim ? 'rgba(255, 255, 255, 0.08)' : (isLeader ? AMBER : AMBER + '20')}`,
                        padding: '18px 22px',
                        display: 'grid',
                        gridTemplateColumns: 'auto auto 1fr auto',
                        alignItems: 'center', gap: '18px',
                        position: 'relative', overflow: 'hidden',
                        opacity: elim ? 0.45 : 1,
                      }}>
                      {playerTotal > 0 && !elim && (
                        <div style={{
                          position: 'absolute', top: 0, left: 0, height: '100%',
                          width: `${barWidth}%`,
                          background: `linear-gradient(90deg, ${AMBER}25 0%, transparent 100%)`,
                          pointerEvents: 'none',
                          transition: 'width 0.5s cubic-bezier(0.4, 0, 0.2, 1)',
                        }} />
                      )}
                      <div style={{
                        fontSize: '28px', fontWeight: 900,
                        fontFamily: '"Bebas Neue", Impact, sans-serif',
                        color: elim ? 'rgba(255, 255, 255, 0.25)' : (rank < 3 ? AMBER : 'rgba(255, 255, 255, 0.3)'),
                        minWidth: '40px', letterSpacing: '0.02em',
                        position: 'relative', zIndex: 1,
                        textDecoration: elim ? 'line-through' : 'none',
                      }}>
                        {elim ? '—' : String(rank + 1).padStart(2, '0')}
                      </div>
                      <div style={{ width: '24px', position: 'relative', zIndex: 1 }}>
                        {elim ? (
                          <Skull className="w-5 h-5" style={{ color: 'rgba(255, 107, 107, 0.6)' }} />
                        ) : (
                          getRankIcon(rank)
                        )}
                      </div>
                      <div style={{
                        fontSize: '17px', fontWeight: 600,
                        color: elim ? 'rgba(255, 255, 255, 0.4)' : (isLeader ? AMBER : '#fff'),
                        overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                        position: 'relative', zIndex: 1,
                        textDecoration: elim ? 'line-through' : 'none',
                      }}>
                        {player.name}
                        {elim && (
                          <span style={{
                            marginLeft: '10px', fontSize: '9px',
                            letterSpacing: '0.2em', color: '#ff6b6b',
                            fontWeight: 700, textDecoration: 'none',
                            padding: '2px 6px', border: '1px solid rgba(255, 107, 107, 0.4)',
                          }}>
                            ELIMINATED
                          </span>
                        )}
                      </div>
                      <div style={{
                        fontSize: '32px', fontWeight: 800,
                        fontFamily: '"Bebas Neue", Impact, sans-serif',
                        color: elim ? 'rgba(255, 255, 255, 0.3)' : (playerTotal !== 0 ? '#fff' : 'rgba(255, 255, 255, 0.25)'),
                        minWidth: '70px', textAlign: 'right', letterSpacing: '0.02em',
                        position: 'relative', zIndex: 1,
                      }}>
                        {playerTotal}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* BREAKDOWN MODE - table with each round */}
            {leaderboardMode === 'breakdown' && (
              <div style={{
                border: `1px solid ${AMBER}30`,
                overflow: 'auto',
              }}>
                <table style={{
                  width: '100%', borderCollapse: 'collapse', minWidth: '700px',
                  fontFamily: 'inherit',
                }}>
                  <thead>
                    <tr style={{
                      background: 'rgba(245, 166, 35, 0.1)',
                      borderBottom: `2px solid ${AMBER}`,
                    }}>
                      <th style={thStyle('left', '60px')}>RANK</th>
                      <th style={thStyle('left', 'auto')}>PLAYER</th>
                      {Array.from({ length: ROUNDS }, (_, i) => (
                        <th key={i} style={thStyle('center', i === ROUNDS - 1 ? '80px' : '60px')}>
                          {i === ROUNDS - 1 ? 'BONUS' : `R${i + 1}`}
                        </th>
                      ))}
                      <th style={{
                        ...thStyle('right', '90px'),
                        color: AMBER, borderLeft: `1px solid ${AMBER}40`,
                      }}>TOTAL</th>
                    </tr>
                  </thead>
                  <tbody>
                    {sortedPlayers.map((player, rank) => {
                      const playerTotal = total(player);
                      const isLeader = rank === 0 && playerTotal > 0 && !player.eliminated;
                      const elim = player.eliminated;
                      return (
                        <tr key={player.id}
                          style={{
                            borderBottom: `1px solid ${AMBER}15`,
                            background: rank % 2 === 0 ? 'transparent' : 'rgba(245, 166, 35, 0.02)',
                            opacity: elim ? 0.45 : 1,
                          }}>
                          <td style={{
                            ...tdStyle,
                            color: elim ? 'rgba(255,255,255,0.25)' : (rank < 3 ? AMBER : 'rgba(255,255,255,0.4)'),
                            fontFamily: '"Bebas Neue", Impact, sans-serif',
                            fontSize: '22px', fontWeight: 900,
                          }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                              {elim ? '—' : String(rank + 1).padStart(2, '0')}
                              {elim ? (
                                <Skull className="w-4 h-4" style={{ color: 'rgba(255, 107, 107, 0.6)' }} />
                              ) : (
                                rank < 3 && <span style={{ display: 'inline-flex' }}>{getRankIcon(rank)}</span>
                              )}
                            </div>
                          </td>
                          <td style={{
                            ...tdStyle, fontSize: '15px', fontWeight: 600,
                            color: elim ? 'rgba(255, 255, 255, 0.4)' : (isLeader ? AMBER : '#fff'),
                            textDecoration: elim ? 'line-through' : 'none',
                          }}>
                            {player.name}
                          </td>
                          {player.rounds.map((s, r) => (
                            <td key={r} style={{
                              ...tdStyle, textAlign: 'center',
                              fontFamily: '"Bebas Neue", Impact, sans-serif',
                              fontSize: '20px', fontWeight: 700,
                              color: elim ? 'rgba(255,255,255,0.3)' : (s !== 0 ? '#fff' : 'rgba(255,255,255,0.2)'),
                            }}>
                              {s}
                            </td>
                          ))}
                          <td style={{
                            ...tdStyle, textAlign: 'right',
                            fontFamily: '"Bebas Neue", Impact, sans-serif',
                            fontSize: '26px', fontWeight: 800,
                            color: elim ? 'rgba(255, 255, 255, 0.3)' : (isLeader ? AMBER : '#fff'),
                            borderLeft: `1px solid ${AMBER}40`,
                            background: isLeader ? `${AMBER}10` : 'transparent',
                          }}>
                            {playerTotal}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </>
        )}

        {/* Footer */}
        <div style={{
          marginTop: '32px', paddingTop: '16px',
          borderTop: `1px solid ${AMBER}30`,
          display: 'flex', justifyContent: 'space-between',
          fontSize: '10px', letterSpacing: '0.2em',
          color: `${AMBER}99`, fontWeight: 600,
          flexWrap: 'wrap', gap: '12px',
        }}>
          <span>PLAYERS · {players.length}</span>
          <span>ROUNDS · {ROUNDS}</span>
          <span>TOTAL POINTS · {players.reduce((s, p) => s + total(p), 0)}</span>
          <span style={{ color: AMBER }}>● LIVE</span>
        </div>
      </div>

      {/* Confirm dialog */}
      {confirmDialog && (
        <div
          onClick={() => setConfirmDialog(null)}
          style={{
            position: 'fixed',
            inset: 0,
            background: 'rgba(0, 0, 0, 0.75)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: 1000,
            padding: '20px',
            backdropFilter: 'blur(4px)',
          }}>
          <div
            onClick={e => e.stopPropagation()}
            style={{
              background: '#0A1628',
              border: `2px solid ${AMBER}`,
              padding: '32px',
              maxWidth: '440px',
              width: '100%',
              boxShadow: `0 20px 60px rgba(0, 0, 0, 0.6), 0 0 80px ${AMBER}20`,
              position: 'relative',
              fontFamily: '"JetBrains Mono", "Courier New", monospace',
            }}>
            <div style={{
              fontSize: '10px',
              letterSpacing: '0.3em',
              color: AMBER,
              fontWeight: 700,
              marginBottom: '12px',
            }}>
              ━━ CONFIRM
            </div>
            <div style={{
              fontSize: '18px',
              fontWeight: 600,
              color: '#fff',
              marginBottom: '28px',
              lineHeight: 1.4,
              fontFamily: '"Bebas Neue", Impact, sans-serif',
              letterSpacing: '0.04em',
              textTransform: 'uppercase',
            }}>
              {confirmDialog.message}
            </div>
            <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end' }}>
              <button
                onClick={() => setConfirmDialog(null)}
                style={{
                  background: 'transparent',
                  border: '1px solid rgba(255, 255, 255, 0.2)',
                  color: 'rgba(255, 255, 255, 0.7)',
                  padding: '12px 22px',
                  fontSize: '11px',
                  letterSpacing: '0.2em',
                  fontWeight: 700,
                  cursor: 'pointer',
                  fontFamily: 'inherit',
                  transition: 'all 0.15s',
                }}
                onMouseEnter={e => {
                  e.currentTarget.style.borderColor = '#fff';
                  e.currentTarget.style.color = '#fff';
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                  e.currentTarget.style.color = 'rgba(255, 255, 255, 0.7)';
                }}>
                CANCEL
              </button>
              <button
                onClick={() => {
                  confirmDialog.onConfirm();
                  setConfirmDialog(null);
                }}
                style={{
                  background: AMBER,
                  border: `1px solid ${AMBER}`,
                  color: '#0A1628',
                  padding: '12px 22px',
                  fontSize: '11px',
                  letterSpacing: '0.2em',
                  fontWeight: 800,
                  cursor: 'pointer',
                  fontFamily: 'inherit',
                  transition: 'all 0.15s',
                }}
                onMouseEnter={e => {
                  e.currentTarget.style.background = AMBER_BRIGHT;
                  e.currentTarget.style.borderColor = AMBER_BRIGHT;
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.background = AMBER;
                  e.currentTarget.style.borderColor = AMBER;
                }}>
                CONFIRM
              </button>
            </div>
          </div>
        </div>
      )}

      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    </div>
  );
}

const thStyle = (align, width) => ({
  padding: '14px 12px',
  textAlign: align,
  fontSize: '10px',
  letterSpacing: '0.2em',
  fontWeight: 700,
  color: 'rgba(255, 255, 255, 0.7)',
  width: width === 'auto' ? undefined : width,
  whiteSpace: 'nowrap',
});

const tdStyle = {
  padding: '14px 12px',
  verticalAlign: 'middle',
};


const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(React.createElement(ScoreKeeper));
</script>
</body>
</html>
